include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  exclude:
    - build/**
    # Generated by `flutter gen-l10n`.
    - lib/l10n/app_localizations*.dart

linter:
  rules:
    # Stricter than flutter_lints (PLAN M0.1). We use package imports
    # everywhere instead of `prefer_relative_imports`: one import style for lib
    # and test, and moving files between features needs no path arithmetic.
    - always_declare_return_types
    - always_use_package_imports
    - avoid_dynamic_calls
    - avoid_void_async
    - cancel_subscriptions
    - directives_ordering
    - prefer_final_in_for_each
    - prefer_final_locals
    - prefer_single_quotes
    - test_types_in_equals
    - throw_in_finally
    - unawaited_futures
    - unnecessary_await_in_return
